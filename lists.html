<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>List</title>
</head>

<body>
    <!-- Unordered list has bullets-->
    <ul>
        <li>London</li>
        <li>Manchester</li>
        <li>Birmingham</li>
        <li>Leeds</li>
    </ul>
    <!-- ordered list has numbers -->
     <ol type="I">
        <li>London</li>
        <li>Manchester</li>
        <li>Birmingham</li>
        <li>Leeds</li>
    </ol>
</body>

</html>
